name: Test box image
run-name: Test box image (${{ inputs.image }})
on:
  workflow_dispatch:
    inputs:
      name:
        description: VM name from box-up (ygbox-...)
        type: string
        required: true
      image:
        description: 'Image definition: 1-32 lowercase letters, digits, hyphens; alphanumeric ends'
        type: string
        required: true
      no_disc:
        description: Confirm no game disc, ROM or signed-in account (app sessions, tokens) is on the box
        type: choice
        options: ['no', 'yes']
        default: 'no'

concurrency:
  group: box-image-${{ inputs.image }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: test-boxes
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    outputs:
      image: ${{ steps.box.outputs.image }}
      version: ${{ steps.box.outputs.version }}
    steps:
      - name: Mask caller address before any other work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMASK'
          import json, os
          from pathlib import Path
          value = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text()).get('inputs', {}).get('allow_cidr', '')
          for item in (value, value.split('/')[0]):
              if item:
                  escaped = item.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::add-mask::' + escaped, flush=True)
          PYMASK
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lifecycle
        id: box
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-boxes.py capture
